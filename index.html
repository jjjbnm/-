<style>
  :root{
    color-scheme: light;
    --bg:#f3f4f9;
    --bg2:#ffffff;
    --glass:rgba(255,255,255,0.55);
    --glass-border:rgba(20,23,40,0.09);
    --text:#161a26;
    --muted:#656b80;
    --accent:#3b63e0;
    --accent2:#7c3aed;
    --glass-blur:18px;

    --c-green:#22c55e;
    --c-yellow:#eab308;
    --c-orange:#f97316;
    --c-red:#ef4444;
    --c-black:#6b7280;
    --c-skull:#7c1230;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0a0c12;
    --bg2:#11141d;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
    --text:#eef0f5;
    --muted:#9aa1b4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Assistant', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Rubik', sans-serif;}

  /* ambient blobs */
  .blob{position:fixed; border-radius:50%; filter:blur(100px); opacity:0.28; z-index:0; pointer-events:none;}
  .blob1{width:520px; height:520px; background:radial-gradient(circle, var(--accent), transparent 70%); top:-180px; right:-120px; animation:float1 22s ease-in-out infinite;}
  .blob2{width:460px; height:460px; background:radial-gradient(circle, var(--accent2), transparent 70%); bottom:-160px; left:-140px; animation:float2 26s ease-in-out infinite;}
  .blob3{width:300px; height:300px; background:radial-gradient(circle, var(--c-red), transparent 70%); top:45%; left:40%; opacity:0.09; animation:float1 30s ease-in-out infinite reverse;}
  @keyframes float1{0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,50px);}}
  @keyframes float2{0%,100%{transform:translate(0,0);} 50%{transform:translate(50px,-40px);}}

  .wrap{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 20px;}

  /* glass card base */
  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    border-radius:20px;
    box-shadow:0 8px 30px rgba(20,23,40,0.06);
  }

  /* header */
  header{padding:60px 0 40px; text-align:center;}
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 16px; border-radius:999px; font-size:13px; color:var(--muted);
    margin-bottom:20px;
  }
  .badge span.dot{width:7px; height:7px; border-radius:50%; background:var(--c-green); box-shadow:0 0 8px var(--c-green);}
  header h1{
    font-size:clamp(38px,7vw,64px); font-weight:900;
    background:linear-gradient(90deg,#161a26,var(--accent) 60%, var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:-0.02em;
  }
  header p{color:var(--muted); font-size:17px; max-width:520px; margin:14px auto 0;}

  .cta-row{display:flex; gap:14px; justify-content:center; margin-top:32px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 26px; border-radius:14px; font-weight:700; font-size:15px;
    text-decoration:none; color:var(--text); border:1px solid var(--glass-border);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    cursor:pointer;
    backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; box-shadow:0 8px 24px rgba(91,140,255,0.28);}
  .btn-primary:hover{box-shadow:0 12px 30px rgba(139,92,246,0.35);}
  .btn-ghost{background:var(--glass);}
  .btn-tiktok{background:rgba(0,0,0,0.9); border:1px solid #000; color:#fff;}
  .btn svg{width:18px; height:18px;}

  section{padding:50px 0;}
  .eyebrow{color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; display:block;}
  .sec-title{font-size:clamp(24px,4vw,32px); font-weight:800; margin-bottom:8px;}
  .sec-sub{color:var(--muted); margin-bottom:32px; font-size:15px;}

  /* tabs */
  .tabs-nav{
    position:sticky; top:14px; z-index:5;
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding:6px; margin:10px auto 0; width:fit-content; max-width:100%;
  }
  .tab-btn{
    border:none; background:transparent; color:var(--muted);
    font-family:'Assistant', sans-serif; font-weight:600; font-size:14px;
    padding:10px 18px; border-radius:14px; cursor:pointer;
    transition:background .18s ease, color .18s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; box-shadow:0 6px 18px rgba(91,140,255,0.28);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* status ladder — signature element */
  .ladder{position:relative; padding-inline-start:0;}
  .ladder::before{
    content:''; position:absolute; top:10px; bottom:10px; right:27px;
    width:2px; background:linear-gradient(180deg, var(--c-green), var(--c-yellow), var(--c-orange), var(--c-red), var(--c-black), var(--c-skull));
    opacity:0.5;
  }
  .rung{
    position:relative; display:flex; align-items:flex-start; gap:18px;
    padding:18px 20px; margin-bottom:12px; padding-inline-end:60px;
  }
  .rung .node{
    position:relative; z-index:1; flex-shrink:0;
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; border:2px solid rgba(20,23,40,0.1);
  }
  .rung .body h3{font-size:17px; font-weight:700; margin-bottom:4px;}
  .rung .body p{color:var(--muted); font-size:14px;}
  .rung[data-lvl="1"] .node{box-shadow:0 0 22px rgba(34,197,94,.5); background:rgba(34,197,94,.12);}
  .rung[data-lvl="2"] .node{box-shadow:0 0 22px rgba(234,179,8,.5); background:rgba(234,179,8,.12);}
  .rung[data-lvl="3"] .node{box-shadow:0 0 22px rgba(249,115,22,.5); background:rgba(249,115,22,.12);}
  .rung[data-lvl="4"] .node{box-shadow:0 0 22px rgba(239,68,68,.5); background:rgba(239,68,68,.12);}
  .rung[data-lvl="5"] .node{box-shadow:0 0 22px rgba(107,114,128,.5); background:rgba(107,114,128,.16);}
  .rung[data-lvl="6"] .node{box-shadow:0 0 26px rgba(124,18,48,.65); background:rgba(124,18,48,.22);}

  /* rules */
  .rules-card{padding:30px;}
  .rules-card ol{list-style:none; counter-reset:rule;}
  .rules-card li{
    counter-increment:rule; position:relative; padding-inline-start:44px; padding-block:12px;
    border-bottom:1px solid rgba(255,255,255,0.06); font-size:15px;
  }
  .rules-card li:last-child{border-bottom:none;}
  .rules-card li::before{
    content:counter(rule); position:absolute; inset-inline-start:0; top:10px;
    width:28px; height:28px; border-radius:8px; background:rgba(91,140,255,.15); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; font-family:'Rubik',sans-serif;
  }
  .rules-note{margin-top:18px; padding:14px 16px; border-radius:12px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25); font-size:13.5px; color:#b91c1c;}

  /* effective date strip */
  .date-strip{
    display:flex; align-items:center; gap:14px; padding:16px 22px; margin-bottom:28px;
    border-inline-start:3px solid var(--accent2);
  }
  .date-strip .big{font-family:'Rubik'; font-weight:800; font-size:18px;}
  .date-strip .small{color:var(--muted); font-size:13.5px;}

  /* subscriptions */
  .plans{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;}
  .plan{padding:26px 22px; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;}
  .plan.highlight{border-color:rgba(139,92,246,0.4);}
  .plan.highlight::before{content:'הכי פופולרי'; position:absolute; top:14px; left:-32px; transform:rotate(-40deg); background:var(--accent2); color:#fff; font-size:11px; font-weight:70[...]}
