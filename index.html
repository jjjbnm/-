<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לא זמינים כרגע</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 420px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        p {
            font-size: 16px;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .compensation {
            background: rgba(255, 204, 0, 0.1);
            border: 1px dashed #ffcc00;
            padding: 10px;
            border-radius: 8px;
            color: #ffde59;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⏳</div>
        <h1>אנחנו לא זמינים כרגע</h1>
        <p>סליחה על אי-הנעימות. אנחנו עובדים מאחורי הקלעים ונחזור בקרוב מאוד!</p>
        <div class="compensation">🎁 כפיצוי על הזמן שלכם, אנחנו ניתן לכם פיצוי של 75%!</div>
    </div>

</body>
</html>
