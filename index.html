<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>שגיאה 418.1 - הכפתור מסרב לשתף פעולה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 450px;
            position: relative;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #ff4d4d;
        }
        p {
            font-size: 16px;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .compensation {
            background: rgba(255, 204, 0, 0.1);
            border: 1px dashed #ffcc00;
            padding: 10px;
            border-radius: 8px;
            color: #ffde59;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .stubborn-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛑</div>
        <h1>שגיאה 418.1 - Button Refuses to Cooperate</h1>
        <p>סליחה, אנחנו לא זמינים כרגע. הכפתור החליט שהוא שובת ולא מוכרח לשתף פעולה עם המערכת.</p>
        <div class="compensation">🎁 כפיצוי על הזמן שלכם, אנחנו ניתן לכם פיצוי של 75%!</div>
        <button class="stubborn-btn" id="recalcitrantBtn" onmouseover="runAway()" onclick="refuseMore()">לחץ עלי (אם תצליח)</button>
    </div>

    <script>
        function runAway() {
            const btn = document.getElementById('recalcitrantBtn');
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 100 - 50;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function refuseMore() {
            alert('הכפתור מוסר דרישת שלום ומסרב להגיב גם ללחיצה!');
        }
    </script>

</body>
</html>
